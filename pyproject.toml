[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-infrastructure-intelligence"
version = "0.1.0"
description = "Sequential, evidence-led financial infrastructure intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "xdial9" }]
dependencies = [
  "click>=8.1,<9",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5",
]

[project.scripts]
fii = "fii.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["I001"]
